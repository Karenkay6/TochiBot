<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TochiBOT</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#30232b;background:#fbf7f5}*{box-sizing:border-box}body{margin:0}header{padding:18px 5%;background:#641f3c;color:white;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px}.shell{max-width:1120px;margin:36px auto;padding:0 18px}.panel{background:white;border:1px solid #eadfe3;border-radius:18px;padding:24px;box-shadow:0 8px 25px #461c3510}h1{font-size:28px;margin:0 0 8px}h2{font-size:20px}p{color:#71616b}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.chatlog{height:380px;overflow:auto;background:#fcfaf9;padding:16px;border-radius:12px;white-space:pre-wrap}.bubble{padding:12px 15px;border-radius:13px;margin:10px 0;max-width:90%;background:#f0e8eb}.bubble.me{margin-left:auto;background:#f4dce6}.controls{display:flex;gap:8px;margin-top:12px}input{width:100%;padding:13px;border:1px solid #d9c8cf;border-radius:9px;font:inherit}button{background:#702444;color:white;border:0;padding:12px 17px;border-radius:9px;cursor:pointer;font:inherit}button.secondary{background:#e9dce2;color:#542039}button:disabled{opacity:.6}form{display:flex;gap:8px}#auth{max-width:480px;margin:65px auto}.authfields{display:grid;gap:12px}ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center}li span{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#8e8189}.error{color:#a32e39}#app,#logout{display:none}@media(max-width:750px){.layout{grid-template-columns:1fr}.shell{margin:20px auto}.chatlog{height:320px}}
</style></head><body><header><strong>✦ TochiBOT</strong><button id="logout" class="secondary">Log out</button></header><main class="shell"><section id="auth" class="panel"><h1>Welcome to TochiBOT</h1><p>Your personal productivity companion.</p><div class="authfields"><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password (8+ characters)"><button onclick="authenticate('login')">Sign in</button><button class="secondary" onclick="authenticate('register')">Create account</button></div><p id="authError" class="error" role="alert"></p></section><section id="app"><h1>Your space to focus</h1><p id="greeting"></p><div class="layout"><article class="panel"><h2>Chat with TochiBOT</h2><div id="chatlog" class="chatlog" aria-live="polite"></div><form id="chatForm"><input id="chatInput" placeholder="Ask TochiBOT anything..." maxlength="4000" required aria-label="Chat message"><button>Send</button></form><p id="chatError" class="error" role="alert"></p></article><article class="panel"><h2>My tasks</h2><form id="taskForm"><input id="taskInput" maxlength="240" placeholder="Add a task" required aria-label="Task title"><button>Add</button></form><ul id="tasks"></ul><p id="taskError" class="error" role="alert"></p></article></div></section></main><script>
let token=sessionStorage.getItem('tochibot_token');const $=id=>document.getElementById(id);
async function api(path,options={}){const res=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(options.headers||{})}});let data=await res.json().catch(()=>({}));if(!res.ok)throw Error(typeof data.detail==='string'?data.detail:'Request failed');return data}
function showApp(yes){$('auth').style.display=yes?'none':'block';$('app').style.display=yes?'block':'none';$('logout').style.display=yes?'block':'none'}
async function authenticate(mode){$('authError').textContent='';try{let d=await api('/api/'+mode,{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.token;sessionStorage.setItem('tochibot_token',token);await initialize()}catch(e){$('authError').textContent=e.message}}
async function initialize(){try{let u=await api('/api/me');showApp(true);$('greeting').textContent='Signed in as '+u.email;await Promise.all([loadTasks(),loadMessages()])}catch(e){logout()}}
function logout(){token=null;sessionStorage.removeItem('tochibot_token');showApp(false)}$('logout').onclick=logout;
function bubble(role,content){let el=document.createElement('div');el.className='bubble'+(role==='user'?' me':'');el.textContent=content;$('chatlog').append(el);$('chatlog').scrollTop=$('chatlog').scrollHeight}
async function loadMessages(){let ms=await api('/api/messages');$('chatlog').replaceChildren();if(!ms.length)bubble('assistant','Hi! I’m TochiBOT. What would you like to work on?');ms.forEach(m=>bubble(m.role,m.content))}
$('chatForm').onsubmit=async e=>{e.preventDefault();let v=$('chatInput').value.trim();if(!v)return;$('chatError').textContent='';$('chatInput').value='';bubble('user',v);let btn=e.target.querySelector('button');btn.disabled=true;try{let d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:v})});bubble('assistant',d.reply)}catch(err){$('chatError').textContent=err.message}finally{btn.disabled=false}};
async function loadTasks(){let rows=await api('/api/tasks');$('tasks').replaceChildren();rows.forEach(t=>{let li=document.createElement('li'),cb=document.createElement('input'),span=document.createElement('span'),del=document.createElement('button');cb.type='checkbox';cb.checked=t.done;cb.style.width='auto';cb.setAttribute('aria-label','Complete '+t.title);cb.onchange=async()=>{try{await api('/api/tasks/'+t.id,{method:'PATCH',body:JSON.stringify({done:cb.checked})});loadTasks()}catch(e){$('taskError').textContent=e.message}};span.textContent=t.title;span.className=t.done?'done':'';del.textContent='×';del.className='secondary';del.setAttribute('aria-label','Delete '+t.title);del.onclick=async()=>{try{await api('/api/tasks/'+t.id,{method:'DELETE'});loadTasks()}catch(e){$('taskError').textContent=e.message}};li.append(cb,span,del);$('tasks').append(li)})}
$('taskForm').onsubmit=async e=>{e.preventDefault();$('taskError').textContent='';try{await api('/api/tasks',{method:'POST',body:JSON.stringify({title:$('taskInput').value})});$('taskInput').value='';loadTasks()}catch(err){$('taskError').textContent=err.message}};
if(token)initialize();
</script></body></html>
